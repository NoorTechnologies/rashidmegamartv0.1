name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/admin-frontend-mock]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
